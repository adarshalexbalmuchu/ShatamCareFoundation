name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Allow manual triggering
  workflow_dispatch:

# Top-level permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Full history for better versioning
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Remove cache to avoid dependency issues
        registry-url: 'https://registry.npmjs.org/'

    - name: Install dependencies
      run: |
        # Fix for Rollup dependency issue in CI environment
        rm -rf node_modules package-lock.json
        npm install
        echo "✅ Dependencies installed successfully"

    - name: Detect custom domain (CNAME)
      id: detect_domain
      run: |
        if [ -f "CNAME" ]; then
          echo "Found CNAME file in repository root:" && cat CNAME
          echo "VITE_CUSTOM_DOMAIN=true" >> $GITHUB_ENV
          echo "custom_domain=true" >> $GITHUB_OUTPUT
        else
          echo "No CNAME file found. Using project page base."
          echo "VITE_CUSTOM_DOMAIN=false" >> $GITHUB_ENV
          echo "custom_domain=false" >> $GITHUB_OUTPUT
        fi

    - name: Type check
      run: npm run typecheck || exit 1
    
    - name: Clean any previous builds
      run: |
        rm -rf dist
        rm -rf node_modules/.cache/gh-pages

    - name: Build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        NODE_ENV: production
        VITE_CUSTOM_DOMAIN: "${{ steps.detect_domain.outputs.custom_domain }}"
      run: |
        # Build with the correct base URL (Vite config already handles this)
        echo "🏗️ Starting build process..."
        echo "Building site (VITE_CUSTOM_DOMAIN=${VITE_CUSTOM_DOMAIN:-false})"
        npm run build || { echo "❌ Build failed"; exit 1; }
        echo "✅ Build completed successfully"
        
        # Create .nojekyll to bypass Jekyll processing
        touch dist/.nojekyll
        
        # Copy .htaccess for proper MIME types (Apache servers)
        cp -f public/.htaccess dist/ 2>/dev/null || echo "No .htaccess found"
        
        # Copy _headers for Netlify-style hosting
        cp -f public/_headers dist/ 2>/dev/null || echo "No _headers found"
        
        # Copy web.config for IIS servers
        cp -f public/web.config dist/ 2>/dev/null || echo "No web.config found"
        
        # Copy 404.html for SPA routing
        cp dist/index.html dist/404.html

        # Include CNAME for custom domain if present
        if [ -f "CNAME" ]; then
          cp CNAME dist/
          echo "✅ CNAME copied to dist/"
        fi
        
        # Copy public assets to dist (ensure critical files are copied)
        cp -f public/favicon.ico dist/ 2>/dev/null || echo "No favicon.ico found"
        cp -f public/favicon.svg dist/ 2>/dev/null || echo "No favicon.svg found"
        cp -f public/robots.txt dist/ 2>/dev/null || echo "No robots.txt found"
        cp -f public/sitemap.xml dist/ 2>/dev/null || echo "No sitemap.xml found"
        cp -f public/_redirects dist/ 2>/dev/null || echo "No _redirects found"
        
        # Copy images directory if it exists
        if [ -d "public/images" ]; then
          cp -r public/images dist/ 2>/dev/null || echo "Failed to copy images directory"
          echo "✅ Images directory copied"
        else
          echo "⚠️ No images directory found in public/"
        fi
        
        # Verify build artifacts
        echo "Checking build output..."
        ls -la dist/
        echo "Checking asset directories..."
        ls -la dist/assets/ || echo "No assets directory found"
        
        # Build size analysis
        echo "📊 Build size analysis:"
        du -sh dist/
        echo "Asset sizes:"
        find dist/assets -name "*.js" -exec ls -lh {} \; 2>/dev/null | awk '{print $5 " " $9}' || echo "No JS assets found"
        find dist/assets -name "*.css" -exec ls -lh {} \; 2>/dev/null | awk '{print $5 " " $9}' || echo "No CSS assets found"

    - name: Verify build output
      run: |
        echo "Verifying build output structure..."
        ls -la dist/
        
        echo "Checking build output integrity..."
        # Check for required files
        for file in index.html 404.html .nojekyll; do
          if [ -f "dist/$file" ]; then
            echo "✅ Found $file"
          else
            echo "❌ Missing $file"
            exit 1
          fi
        done
        
        # Check for assets directory
        if [ -d "dist/assets" ]; then
          echo "✅ Assets directory exists"
        else
          echo "❌ Missing assets directory"
          exit 1
        fi
        
        # Verify asset paths in HTML files
        echo "Checking asset paths in HTML files..."
        if [ "${{ steps.detect_domain.outputs.custom_domain }}" = "true" ]; then
          # On custom domain, assets should NOT be prefixed with project path
          if grep -q '/ShatamCareFoundation/assets/' dist/index.html; then
            echo "❌ Found project path prefix in assets on custom domain build"
            exit 1
          else
            echo "✅ Asset paths suitable for custom domain"
          fi
        else
          # On project pages, assets should be prefixed
          if grep -q '/ShatamCareFoundation/assets/' dist/index.html; then
            echo "✅ Asset paths prefixed for project pages"
          else
            echo "⚠️ Asset paths may not be prefixed for project pages"
          fi
        fi
        
        # Make sure no source files are included
        if [ -d "dist/src" ]; then
          echo "❌ Source files found in dist/src! Removing..."
          rm -rf dist/src
        else
          echo "✅ No source files in dist/"
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Verify deployment
        run: |
          echo "⏳ Waiting for GitHub Pages deployment to propagate (45 seconds)..."
          sleep 45
          
          echo "🔍 Verifying deployment..."
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          
          # Function to check URL with retry
          check_url() {
            local url=$1
            local max_retries=3
            local retry=0
            local status
            
            while [ $retry -lt $max_retries ]; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              if [ "$status" -eq 200 ]; then
                return 0
              fi
              echo "Attempt $((retry + 1)) failed (status: $status). Retrying..."
              retry=$((retry + 1))
              sleep 10
            done
            return 1
          }
          
          # Check main page
          if check_url "$SITE_URL"; then
            echo "✅ Main site is accessible!"
            
            # Check for source file references
            RESPONSE=$(curl -s "$SITE_URL")
            if ! echo "$RESPONSE" | grep -q "src/"; then
              echo "✅ No unwanted source references found"
            else
              echo "⚠️ WARNING: Found source file references"
            fi
            
            # Verify assets tag presence
            if echo "$RESPONSE" | grep -q "/assets/"; then
              echo "✅ Asset tags present in HTML"
            else
              echo "⚠️ WARNING: No asset tags found"
            fi
            
            # Check SPA routing
            if check_url "${SITE_URL}#/programs"; then
              echo "✅ SPA routing (HashRouter) is working"
            else
              echo "⚠️ SPA routing check failed - verify manually"
            fi
          else
            echo "❌ Site verification failed after multiple attempts"
            echo "Please check the deployment manually at: $SITE_URL"
          fi
