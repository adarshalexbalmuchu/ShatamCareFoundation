# Nginx configuration for ShatamCare.org
server {
    listen 80;
    listen 443 ssl;
    server_name shatamcare.org www.shatamcare.org;
    
    root /var/www/shatamcare.org;
    index index.html;
    
    # Serve static files with correct MIME types
    location ~* \.(js|mjs)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(css)$ {
        add_header Content-Type "text/css; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(svg)$ {
        add_header Content-Type "image/svg+xml";
        expires 1y;
        add_header Cache-Control "public";
    }
    
    location ~* \.(ico)$ {
        add_header Content-Type "image/x-icon";
        expires 1y;
        add_header Cache-Control "public";
    }
    
    location ~* \.(png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
    
    # Handle favicon requests specifically
    location = /favicon.ico {
        try_files /favicon.ico =404;
    }
    
    location = /favicon.svg {
        try_files /favicon.svg =404;
    }
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # SPA routing - try files, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
}
